<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>مافیا سان | ورود و ثبت نام</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #0a0c10;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: url('https://cdn.imgurl.ir/uploads/i13489_file_00000000ce4071fd96295e0893579ed1.png');
            background-size: cover;
            background-position: center;
        }
        .loading-overlay {
            position: fixed;
            top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.3s;
        }
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(240,192,64,0.3);
            border-top-color: #f0c040;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .auth-card {
            background: rgba(10,12,16,0.9);
            backdrop-filter: blur(12px);
            width: 90%;
            max-width: 400px;
            border-radius: 32px;
            padding: 30px 20px;
            border: 1px solid rgba(240,192,64,0.3);
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin: 20px;
        }
        .auth-card h2 {
            color: #f0c040;
            margin-bottom: 20px;
        }
        .auth-input {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border-radius: 40px;
            background: rgba(255,255,255,0.1);
            border: 1px solid #2a2a40;
            color: white;
            font-family: inherit;
            font-size: 1rem;
        }
        .auth-btn {
            width: 100%;
            padding: 12px;
            border-radius: 40px;
            background: linear-gradient(135deg, #f0c040, #b8860b);
            border: none;
            font-weight: bold;
            font-size: 1rem;
            margin-top: 12px;
            cursor: pointer;
            color: #000;
        }
        .auth-btn.secondary {
            background: transparent;
            border: 1px solid #f0c040;
            color: #f0c040;
        }
        .auth-error {
            color: #ff6b6b;
            font-size: 0.8rem;
            margin-top: 8px;
            display: none;
        }
        .step { display: none; }
        .step.active { display: block; }
        .info-text {
            color: #aaa;
            font-size: 0.8rem;
            margin-top: 10px;
        }
        .ban-warning {
            background: rgba(192,57,43,0.9);
            padding: 10px;
            border-radius: 20px;
            margin-top: 15px;
            font-size: 0.8rem;
            display: none;
        }
    </style>
</head>
<body>
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner"></div>
    </div>

    <div id="authCard" class="auth-card" style="display: none;">
        <h2>⚡ مافیا سان ⚡</h2>
        <div id="step1" class="step active">
            <input type="tel" id="phoneInput" class="auth-input" placeholder="شماره موبایل">
            <button id="nextToPassBtn" class="auth-btn">ادامه</button>
            <div id="err1" class="auth-error"></div>
        </div>
        <div id="step2" class="step">
            <input type="password" id="passInput" class="auth-input" placeholder="رمز عبور">
            <button id="loginBtn" class="auth-btn">ورود</button>
            <div id="err2" class="auth-error"></div>
            <div class="info-text">رمز خود را فراموش کرده‌اید؟ با پشتیبانی تماس بگیرید</div>
        </div>
        <div id="step3" class="step">
            <p style="color:#aaa;">کد تایید: <strong style="color:#f0c040;">16172</strong></p>
            <input type="text" id="codeInput" class="auth-input" placeholder="کد را وارد کنید">
            <button id="verifyCodeBtn" class="auth-btn">تایید</button>
            <div id="err3" class="auth-error"></div>
        </div>
        <div id="step4" class="step">
            <input type="text" id="regNameInput" class="auth-input" placeholder="نام کاربری (2-12 حرف)">
            <input type="password" id="regPassInput" class="auth-input" placeholder="رمز عبور جدید">
            <input type="number" id="ageInput" class="auth-input" placeholder="سن">
            <button id="registerBtn" class="auth-btn">ثبت نام و ورود</button>
            <div id="err4" class="auth-error"></div>
        </div>
        <div id="banWarning" class="ban-warning"></div>
    </div>

    <script>
        // API Configuration
        const BIN_ID = '6984ae3a43b1c97be967c32b';
        const API_KEY = '$2a$10$P2f/7ECPzq3HSI.6DSdcr.MaV748WQF7smMQL1bczP6YF4XKwjNvG';
        const BIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
        
        let db = { users: {}, bans: [] };
        let currentPhone = null;

        async function loadDB() {
            try {
                const res = await fetch(BIN_URL + '/latest', { headers: { 'X-Master-Key': API_KEY } });
                const data = await res.json();
                if (data.record) {
                    db = data.record;
                    if (!db.bans) db.bans = [];
                    if (!db.users) db.users = {};
                }
                localStorage.setItem('mafia_db_backup', JSON.stringify(db));
            } catch(e) {
                const backup = localStorage.getItem('mafia_db_backup');
                if(backup) db = JSON.parse(backup);
                if (!db.bans) db.bans = [];
            }
            await ensureSpecials();
        }

        async function ensureSpecials() {
            const SPECIALS = [
                { phone:'09904844031', pass:'Admin16172-matin-1000', name:'ᴀᴍᴏᴍɪᴛɪ', role:'creator', tick:'blue', gems:999, coins:999 },
                { phone:'09940940720', pass:'Erfan.sh85', name:'♛✯ Èr£åñ_ʂɧ ✯♛', role:'support', tick:'blue', gems:999, coins:999 },
                { phone:'09324134243', pass:'13851385', name:'محمود', role:'observer', tick:'orange', gems:10, coins:10 },
                { phone:'09908823688', pass:'Player_mafia', name:'•⊰هــیــراد⊱•', role:'observer', tick:'orange', gems:10, coins:10 },
                { phone:'09051396023', pass:'ARAZ1381', name:'elijah021', role:'admin', tick:'brown', gems:10, coins:10 },
                { phone:'09039184457', pass:'13861386', name:'Shadi', role:'admin', tick:'brown', gems:10, coins:10 },
                { phone:'09305075756', pass:'123456789', name:'FARZAM', role:'admin', tick:'brown', gems:10, coins:10 }
            ];
            let updated = false;
            for(const s of SPECIALS) {
                if(!db.users[s.phone]) {
                    db.users[s.phone] = {
                        phone: s.phone, password: s.pass, name: s.name, age: 25, role: s.role, tick: s.tick,
                        gems: s.gems, coins: s.coins, avatar: 'avatar1', ownedAvatars: ['avatar1','avatar2','ninja','samurai','avatar17','avatar18'],
                        editCount: 0, stats: { wins:0, losses:0, hours:0, obs:0 }
                    };
                    updated = true;
                } else {
                    let u = db.users[s.phone];
                    if(s.role === 'creator' || s.role === 'support') {
                        if(u.gems !== 999) u.gems = 999;
                        if(u.coins !== 999) u.coins = 999;
                    } else {
                        if(u.gems > 10) u.gems = 10;
                        if(u.coins > 10) u.coins = 10;
                    }
                    updated = true;
                }
            }
            if(updated) await saveDB();
        }

        async function saveDB() {
            try {
                await fetch(BIN_URL, { method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY }, body: JSON.stringify(db) });
                localStorage.setItem('mafia_db_backup', JSON.stringify(db));
            } catch(e) { console.warn('ذخیره روی سرور ناموفق'); }
        }

        function getActiveBan(phone) {
            const ban = db.bans.find(b => b.phone === phone && (b.permanent || (b.expiry && b.expiry > Date.now())));
            if(!ban) return null;
            const remaining = ban.permanent ? 'دائمی' : Math.ceil((ban.expiry - Date.now()) / 1000 / 60) + ' دقیقه باقی';
            return { ...ban, remaining };
        }

        function showStep(stepId) {
            document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
            document.getElementById(stepId).classList.add('active');
        }

        async function login(phone, password) {
            const user = db.users[phone];
            if(!user || user.password !== password) {
                document.getElementById('err2').innerText = 'شماره یا رمز اشتباه است';
                document.getElementById('err2').style.display = 'block';
                return false;
            }
            const ban = getActiveBan(phone);
            if(ban) {
                document.getElementById('banWarning').innerHTML = `⛔ شما بن شده‌اید!<br>دلیل: ${ban.reason}<br>توسط: ${ban.bannedBy}<br>${ban.remaining}`;
                document.getElementById('banWarning').style.display = 'block';
                return false;
            }
            // ذخیره نشست و هدایت به صفحه بازی
            localStorage.setItem('mafia_user_phone', phone);
            window.location.href = 'game.html';
            return true;
        }

        async function register(phone, name, password, age) {
            if(db.users[phone]) {
                document.getElementById('err4').innerText = 'این شماره قبلاً ثبت شده است';
                document.getElementById('err4').style.display = 'block';
                return false;
            }
            const newUser = {
                phone, password, name, age: parseInt(age),
                role: 'normal', tick: null, gems: 10, coins: 10,
                avatar: 'avatar1', ownedAvatars: ['avatar1','avatar2'],
                editCount: 0, stats: { wins:0, losses:0, hours:0, obs:0 }
            };
            db.users[phone] = newUser;
            await saveDB();
            localStorage.setItem('mafia_user_phone', phone);
            window.location.href = 'game.html';
            return true;
        }

        window.onload = async () => {
            // نمایش لودینگ کوتاه
            setTimeout(() => {
                document.getElementById('loadingOverlay').style.display = 'none';
                document.getElementById('authCard').style.display = 'block';
            }, 300);
            await loadDB();
            
            // بررسی اگر قبلاً لاگین بوده و بن نیست، برو به game
            const savedPhone = localStorage.getItem('mafia_user_phone');
            if(savedPhone && db.users[savedPhone]) {
                const ban = getActiveBan(savedPhone);
                if(!ban) {
                    window.location.href = 'game.html';
                    return;
                }
            }

            // رویدادها
            document.getElementById('nextToPassBtn').onclick = () => {
                const phone = document.getElementById('phoneInput').value.trim();
                if(phone.length < 10) {
                    document.getElementById('err1').innerText = 'شماره معتبر وارد کنید';
                    document.getElementById('err1').style.display = 'block';
                    return;
                }
                currentPhone = phone;
                if(db.users[phone]) {
                    showStep('step2');
                } else {
                    showStep('step3');
                }
            };
            document.getElementById('loginBtn').onclick = async () => {
                const pass = document.getElementById('passInput').value.trim();
                await login(currentPhone, pass);
            };
            document.getElementById('verifyCodeBtn').onclick = () => {
                const code = document.getElementById('codeInput').value.trim();
                if(code !== '16172') {
                    document.getElementById('err3').innerText = 'کد نادرست است';
                    document.getElementById('err3').style.display = 'block';
                    return;
                }
                showStep('step4');
            };
            document.getElementById('registerBtn').onclick = async () => {
                const name = document.getElementById('regNameInput').value.trim();
                const pass = document.getElementById('regPassInput').value.trim();
                const age = document.getElementById('ageInput').value.trim();
                if(name.length < 2 || name.length > 12) {
                    document.getElementById('err4').innerText = 'نام باید بین ۲ تا ۱۲ حرف باشد';
                    document.getElementById('err4').style.display = 'block';
                    return;
                }
                if(pass.length < 4) {
                    document.getElementById('err4').innerText = 'رمز حداقل ۴ حرف';
                    document.getElementById('err4').style.display = 'block';
                    return;
                }
                if(isNaN(age) || age < 1 || age > 120) {
                    document.getElementById('err4').innerText = 'سن معتبر وارد کنید';
                    document.getElementById('err4').style.display = 'block';
                    return;
                }
                await register(currentPhone, name, pass, age);
            };
        };
    </script>
</body>
</html>
